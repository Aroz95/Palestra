<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10191d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Tema scelto prima del primo disegno (evita il lampo di colore)
      try {
        var t = JSON.parse(localStorage.getItem('palestra:theme') || '"system"')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Palestra" />
    <title>Palestra — diario di allenamento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
